services:
  ros:
    build: .
    network_mode: host
    ipc: host
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./ws:/ws
    devices:
      - /dev/dri:/dev/dri   # aceleración con la GPU integrada
    stdin_open: true
    tty: true
